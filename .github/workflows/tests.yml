name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# No artifacts are uploaded: results are only the pass/fail status of the run.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Typecheck and build (same as Netlify)
        run: npm run build
      - name: Python engine tests
        run: |
          python -m pip install ezdxf==1.4.4 pyproj==3.7.2 pytest
          python -m pytest tests -q
      - name: Node and WebAssembly runtime tests
        run: npm test
